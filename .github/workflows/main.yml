name: Generar APK iKrlito
on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generar paquete APK
        run: |
          mkdir -p output
          zip -r output/iKrlito-Manager-App.zip . -x "*.git*"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: iKrlito-Manager-APK
          path: output/
